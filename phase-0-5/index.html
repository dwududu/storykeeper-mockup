<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 0.5 — the current app, restyled</title>
<style>
  :root{
    --ink:#1A1714; --body:#4A443D; --muted:#8A8377; --line:#E4DCCE; --paper:#F6F1E7;
    --card:#FFFDF8; --deep:#2F4A3F; --deep-soft:#E2EBE4; --brass:#A8641F; --brass-soft:#F6E9D8;
    --oxblood:#8C3A2E; --oxblood-soft:#F5E3DF; --slate:#5B6B73; --slate-soft:#E6ECEF; --desk:#DCD1BE;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{margin:0;background:var(--desk);color:var(--body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .shell{display:flex;gap:34px;padding:34px;align-items:flex-start;max-width:1180px;margin:0 auto}
  .notes{flex:1 1 auto;max-width:430px;position:sticky;top:34px}
  .notes h1{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#8A8377;margin:0 0 6px;font-weight:800}
  .notes .lede{font-size:14.5px;line-height:1.6;color:#3B352E;margin:0 0 16px}
  .phases{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
  .phases a{text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:6px 10px;font-size:11px;font-weight:800;color:#4A443D}
  .phases a.on{background:var(--brass);border-color:var(--brass);color:#fff}
  .screens{display:flex;flex-direction:column;gap:2px}
  .screens button{text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;
    font:inherit;font-size:13px;color:#3B352E;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  .screens button.on{background:var(--card);box-shadow:0 1px 0 var(--line),0 6px 16px rgba(60,45,25,.07);
    color:var(--ink);font-weight:700}
  .screens small{color:#9C948A;font-size:11px;font-weight:600}
  .what{font-size:13px;line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;margin-top:16px}
  .what b{color:var(--ink)} .what p{margin:0 0 8px} .what p:last-child{margin:0}
  .phone{position:relative;width:390px;height:844px;background:var(--paper);border:11px solid #17140F;
    border-radius:52px;overflow:hidden;box-shadow:0 26px 60px rgba(35,25,15,.28);flex:0 0 auto}
  .statusbar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;
    font-size:12.5px;font-weight:700;color:var(--ink)}
  .statusbar .icons{display:flex;gap:5px;align-items:center}
  #view{position:absolute;inset:42px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .screen{display:none;flex:1;flex-direction:column;overflow:hidden}
  .screen.on{display:flex}
  .scroll{overflow-y:auto;flex:1;padding:0 20px 22px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .appbar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 10px;gap:10px}
  .eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#8A8377;font-weight:800}
  h2.title{font-size:24px;line-height:1.2;margin:4px 0 4px;color:var(--ink);font-weight:400;
    font-family:Georgia,"Times New Roman",serif}
  h3.sect{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#8A8377;margin:18px 0 8px;font-weight:800}
  p.sub{font-size:13.5px;line-height:1.55;color:#4A443D;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;
    box-shadow:0 2px 10px rgba(50,35,20,.04)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .name{font-weight:700;font-size:14.5px;color:var(--ink)}
  .meta{font-size:12px;color:var(--muted)}
  .pill{display:inline-block;background:#EFE8DA;color:#4A443D;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:700}
  .tag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;margin:0 4px 4px 0;display:inline-block}
  .tag.deep{color:var(--deep);background:var(--deep-soft)}
  .tag.brass{color:var(--brass);background:var(--brass-soft)}
  .quote{font-size:14.5px;line-height:1.6;color:var(--ink);margin:6px 0 0}
  .quote.serif{font-family:Georgia,serif;font-size:15.5px}
  .note{font-size:11.5px;line-height:1.55;color:#8A8377}
  .btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:13px;font:inherit;
    font-size:14.5px;font-weight:700;background:var(--deep);color:#fff;cursor:pointer;margin-top:8px}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .talkbar{flex:0 0 auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    background:rgba(246,241,231,.98)}
  .statebtn{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--card);
    border-radius:14px;padding:13px 15px;font:inherit;cursor:pointer}
  .statebtn .led{width:10px;height:10px;border-radius:50%;background:var(--brass);flex:0 0 auto;
    box-shadow:0 0 0 4px rgba(168,100,31,.14)}
  .statebtn.listen .led{background:var(--deep);box-shadow:0 0 0 4px rgba(47,74,63,.14)}
  .statebtn .txt{font-size:14.5px;font-weight:700;color:var(--ink);text-align:left;flex:1}
  .statebtn .hint{font-size:11px;color:#8A8377;font-weight:600}
  .wave{display:flex;align-items:flex-end;gap:4px;height:30px}
  .wave i{display:block;width:3px;border-radius:2px;background:var(--brass);height:8px;animation:rise 1.1s ease-in-out infinite}
  .wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}
  .wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
  .wave i:nth-child(6){animation-delay:.6s}.wave i:nth-child(7){animation-delay:.72s}
  @keyframes rise{0%,100%{height:7px;opacity:.5}50%{height:24px;opacity:1}}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px}
  .field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;color:#BFB4A1;font-size:14px}
  .cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#B3A996;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="shell">
  <aside class="notes">
    <h1>Phase 0.5 · the app as it is, restyled</h1>
    <p class="lede">Exactly what the current APK does today, wearing the Phase 0 design. No new function, no new screen, nothing from Phase 1 or later. This is the checkpoint before any rebuilding.</p>
    <div class="phases">
      <a href="../">Index</a>
      <a href="../phase-0/">0</a>
      <a class="on" href="./">0.5</a>
      <a href="../phase-1/">1</a>
      <a href="../phase-2/">2</a>
      <a href="../phase-3/">3</a>
    </div>
    <div class="screens" id="list"></div>
    <div class="what" id="what"></div>
  </aside>

  <div class="phone">
    <div class="statusbar"><span>21:08</span>
      <div class="icons">
        <svg width="17" height="11" viewBox="0 0 17 11"><rect y="7" width="3" height="4" rx="1" fill="#1A1714"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#1A1714"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#1A1714"/><rect x="13.5" width="3" height="11" rx="1" fill="#1A1714" opacity=".35"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11"><rect x=".5" y=".5" width="20" height="10" rx="3" fill="none" stroke="#1A1714" opacity=".4"/><rect x="2" y="2" width="15" height="7" rx="2" fill="#1A1714"/><rect x="21.5" y="4" width="2" height="3" rx="1" fill="#1A1714" opacity=".5"/></svg>
      </div>
    </div>
    <div id="view"></div>
  </div>
</div>

<script>
const wave = () => `<div class="wave">${Array.from({length:7}).map(()=>"<i></i>").join("")}</div>`;

const SCREENS = [
  { id:"call",  label:"The call",       sub:"v0.3.3, listening" },
  { id:"first", label:"First call",     sub:"the introduction" },
  { id:"corpus",label:"Passages",       sub:"what exists today" },
  { id:"signin",label:"Sign in",        sub:"still there" },
];

const WHAT = {
  call: "<b>Same app, new skin.</b><p>The only changes are the palette, the type and the control at the bottom. The orange orb becomes the state control, which is the one design decision already taken; everything else on this screen is what ships today, including the passages counter and the single End session.</p>",
  first: "<b>The introduction.</b><p>Mina's opening line, pre-rendered, with the caption underneath. Today it is the only moment of the app that knows what it is for.</p>",
  corpus: "<b>The passage list.</b><p>This is the current 'corpus' screen: name, sessions filed, the question she means to ask next, threads left open, theme tags and the passages with their time ranges. Restyled only; no search, no filters, no photos. Those are Phase 1.</p>",
  signin: "<b>Unchanged in function.</b><p>Phone number, then a code. It stays until the pilot, and it is the first thing a store reviewer would see, which is why it is worth looking at in the new skin.</p>",
};

const D = {
  name: "David Wu",
  passages: [
    { theme:"childhood home", time:"6:34 – 7:20", said:"You could hear the tram all night. I didn't mind it. I still can't sleep in a quiet room." },
    { theme:"first work", time:"8:47 – 9:13", said:"I was twenty two and working at a print shop. I had saved for a year. It was a Kawasaki Ninja, green." },
    { theme:"objects", time:"9:27 – 9:36", said:"My first motorbike was a Kawasaki Ninja. Three hundred, I think two thousand and fourteen or thereabouts." },
  ],
};

function scrCall() {
  return `<div class="scroll" style="display:flex;flex-direction:column">
    <div class="appbar"><span class="eyebrow">Storykeeper</span><span class="pill">Mina · neutral voice</span></div>
    <div class="center">
      <div class="row" style="justify-content:center;gap:14px;margin-bottom:22px">
        <div style="width:38px;height:38px;border-radius:50%;background:var(--brass-soft);color:var(--brass);
          font-weight:800;display:flex;align-items:center;justify-content:center">M</div>
        ${wave()}
      </div>
      <p class="quote serif" style="font-size:17px">Tell me about the room you slept in as a boy.</p>
      <p class="note" style="margin-top:14px">0 passages kept · 0 dropped</p>
    </div>
  </div>
  <div class="talkbar">
    <button class="statebtn listen"><span class="led"></span><span class="txt">Listening — your turn</span><span class="hint">tap to interrupt</span></button>
    <button class="btn ghost" style="margin-top:8px">End session</button>
  </div>`;
}

function scrFirst() {
  return `<div class="scroll" style="display:flex;flex-direction:column">
    <div class="appbar"><span class="eyebrow">Storykeeper</span><span class="pill">first call</span></div>
    <div class="center" style="align-items:flex-start;text-align:left">
      <p class="eyebrow" style="margin-bottom:10px">she is speaking</p>
      <p class="quote serif" style="font-size:17.5px;line-height:1.62">I am Mnemosyne, keeper of histories. You may call me Mem, or Mina. I am not a real person… but I am here to record your stories.</p>
      <p class="quote serif" style="font-size:17.5px;line-height:1.62;margin-top:10px">What you say here shall be kept, so that one day it may be passed on to those you love and never forgotten.</p>
    </div>
  </div>
  <div class="talkbar">
    <button class="statebtn"><span class="led"></span><span class="txt">Mina speaking</span><span class="hint">tap to interrupt</span></button>
  </div>`;
}

function scrCorpus() {
  return `<div class="scroll">
    <div class="appbar"><span class="eyebrow">passages</span><span class="meta">3 sessions filed</span></div>
    <h2 class="title">${D.name}'s life</h2>
    <div class="card" style="border-left:3px solid var(--brass)">
      <span class="eyebrow" style="color:var(--brass)">ask this next</span>
      <p class="quote" style="margin-top:6px">What happened to Ah Kin after he worked for your father?</p>
    </div>
    <h3 class="sect">left open</h3>
    <div class="card" style="padding:11px 14px"><p class="note" style="margin:0">the pretend cops and robbers in the street · sneaking out to ride the bike · the first day at the print shop</p></div>
    <h3 class="sect">tagged</h3>
    <div style="margin-bottom:6px"><span class="tag deep">childhood home · 3</span><span class="tag brass">first work · 1</span><span class="tag deep">objects · 1</span></div>
    <h3 class="sect">passages</h3>
    ${D.passages.map(p => `<div class="card">
      <div class="row"><span class="eyebrow">${p.theme}</span><span class="meta">${p.time}</span></div>
      <p class="quote" style="font-size:13.5px">${p.said}</p></div>`).join("")}
    <p class="cap" style="margin:10px 0 6px">no screen to read · one question at a time</p>
    <button class="btn" style="margin-top:0">Start a session</button>
  </div>`;
}

function scrSignin() {
  return `<div class="scroll">
    <div class="appbar"><span class="eyebrow">Storykeeper</span><span class="meta">sign in</span></div>
    <div style="padding:26px 2px 0">
      <h2 class="title">Let Mina talk you through it</h2>
      <p class="sub" style="margin-top:6px">A phone number and a code. No password to remember.</p>
      <div class="field" style="margin-top:18px">+852 6773 6672</div>
      <button class="btn" style="margin-top:10px">Send code</button>
      <div class="field" style="margin-top:16px">four digits</div>
      <button class="btn ghost" style="margin-top:10px">Continue</button>
      <p class="note" style="margin-top:16px">By continuing you agree to the privacy notice. Nothing is recorded until the microphone is on and she has said so.</p>
    </div>
  </div>`;
}

const MAP = { call:scrCall, first:scrFirst, corpus:scrCorpus, signin:scrSignin };
let cur = (location.hash || "#call").replace("#","");
if (!MAP[cur]) cur = "call";

function render() {
  document.getElementById("view").innerHTML = `<div class="screen on">${MAP[cur]()}</div>`;
  document.getElementById("what").innerHTML = WHAT[cur];
  document.getElementById("list").innerHTML = SCREENS.map(s =>
    `<button class="${s.id===cur?'on':''}" onclick="go('${s.id}')"><span>${s.label}</span><small>${s.sub}</small></button>`).join("");
  location.hash = cur;
}
function go(id){ cur=id; render(); }
render();
</script>
</body>
</html>
