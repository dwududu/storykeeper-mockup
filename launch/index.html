<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mem — the tome opens</title>
<style>
  :root{
    --paper:#F6F1E7; --paper2:#FFFDF8; --ink:#1A1714; --brass:#A8641F; --deep:#2F4A3F;
    --leather:#3A2A22; --leather2:#241813;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#DCD1BE;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  .stage{width:390px;height:844px;background:radial-gradient(120% 80% at 50% 30%,#FBF6EC 0%,#F1E9DA 55%,#E4D9C4 100%);
    border-radius:44px;position:relative;overflow:hidden;perspective:1500px;display:flex;
    align-items:center;justify-content:center;box-shadow:0 30px 70px rgba(40,28,18,.25)}
  .book{position:relative;width:250px;height:330px;transform-style:preserve-3d;
    transform:rotateX(14deg) rotateY(-8deg);animation:settle 1.4s ease-out both}
  /* the block of pages, seen once the cover swings away */
  .pages{position:absolute;inset:0;transform:translateZ(-3px);background:linear-gradient(90deg,#E9DFCB 0 6px,var(--paper2) 6px);
    border-radius:3px 8px 8px 3px;box-shadow:inset 0 0 0 1px #E0D5BF, 0 18px 40px rgba(50,35,20,.22);
    display:flex;flex-direction:column;justify-content:center;padding:34px 30px 34px 38px;gap:14px}
  .rule{height:1px;background:#E2D6C0}
  .line{height:9px;border-radius:5px;background:linear-gradient(90deg,var(--ink),var(--ink));
    opacity:.18;transform:scaleX(0);transform-origin:left center;animation:write .9s ease-out forwards}
  .line.t{border-radius:3px;opacity:.5;height:15px;background:var(--ink)}
  .line.w1{width:78%;animation-delay:1.55s}
  .line.w2{width:92%;animation-delay:1.75s}
  .line.w3{width:64%;animation-delay:1.95s}
  .line.title{width:56%;height:20px;opacity:.72;animation-delay:1.35s;background:var(--deep)}
  .sig{font-family:Georgia,serif;font-style:italic;font-size:15px;color:#8B7A63;opacity:0;
    animation:fade 1s ease-out 2.35s forwards;margin-top:6px}
  /* the cover: pivots on the spine, which is the left edge */
  .cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
    animation:open 1.25s cubic-bezier(.22,.72,.16,1) 0.55s forwards}
  .face{position:absolute;inset:0;border-radius:3px 9px 9px 3px;backface-visibility:hidden;transform:translateZ(3px);
    background:
      radial-gradient(140% 120% at 30% 20%,#4A352A 0%,var(--leather) 45%,var(--leather2) 100%);
    box-shadow:0 26px 50px rgba(30,20,10,.38), inset 0 0 0 1px #5A4132}
  .face.back{transform:rotateY(180deg) translateZ(3px);
    background:
      linear-gradient(90deg,#D9CBB2 0 10px,#FBF6EB 10px 26px,#F3EAD8 26px 100%);
    box-shadow:inset -18px 0 26px rgba(120,95,60,.14), inset 0 0 0 1px #DED2BB}
  .spine{position:absolute;left:0;top:0;bottom:0;width:14px;border-radius:3px 0 0 3px;
    background:linear-gradient(90deg,#1B1310,#3A2A22 60%,#2A1C16)}
  .plate{position:absolute;left:26px;right:26px;top:46px;bottom:46px;border:1px solid rgba(168,100,31,.55);
    border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .plate .mark{width:34px;height:34px;border:1px solid rgba(200,161,94,.8);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#C8A15E;font-size:13px}
  .plate h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.34em;color:#D9BC86;font-size:20px;margin:6px 0 0;
    text-indent:.34em}
  .plate p{margin:0;font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:#A98E5C}
  .clasp{position:absolute;right:-7px;top:50%;width:14px;height:26px;margin-top:-13px;border-radius:3px;
    background:linear-gradient(180deg,#D9BC86,#8E6A34);box-shadow:0 1px 3px rgba(0,0,0,.4);opacity:1}
  .glow{position:absolute;inset:-40% -30%;background:radial-gradient(closest-side,rgba(255,246,225,.55),transparent 70%);
    opacity:0;animation:glow 1.6s ease-out 1.1s forwards;pointer-events:none}
  @keyframes settle{from{transform:rotateX(18deg) rotateY(-12deg) translateY(6px)}to{transform:rotateX(14deg) rotateY(-8deg)}}
  @keyframes open{0%{transform:rotateY(0)}100%{transform:rotateY(-158deg)}}
  @keyframes write{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes glow{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
  .cap{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#A79C8B}
  .again{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);border:1px solid #C9B79A;background:#FFFDF8;
    border-radius:999px;padding:8px 14px;font:inherit;font-size:12px;font-weight:700;color:#4A443D;cursor:pointer}
  @media (prefers-reduced-motion: reduce){
    .cover{animation:none;transform:rotateY(-158deg)}
    .line,.sig{animation:none;transform:scaleX(1);opacity:.6}
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="book">
      <div class="pages">
        <div class="line title"></div>
        <div class="line t w1"></div>
        <div class="line w2"></div>
        <div class="line w3"></div>
        <div class="rule"></div>
        <div class="sig">and that is where the story starts.</div>
      </div>
      <div class="cover">
        <div class="face front">
          <div class="spine"></div>
          <div class="plate">
            <div class="mark">M</div>
            <h1>MEM</h1>
            <p>a life, in his words</p>
          </div>
          <div class="clasp"></div>
        </div>
        <div class="face back"></div>
      </div>
    </div>
    <div class="glow"></div>
    <div class="cap">the first page is blank until you speak</div>
  </div>
  <button class="again" onclick="replay()">play again</button>
<script>
  function replay(){
    const s=document.getElementById('stage');
    const clone=s.cloneNode(true); s.parentNode.replaceChild(clone,s);
  }
</script>
</body>
</html>
