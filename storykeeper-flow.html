<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storykeeper — interactive spec v4</title>
<style>
  :root{
    --ink:#1A1714; --body:#4A443D; --muted:#8A8377; --line:#E4DCCE;
    --paper:#F6F1E7; --card:#FFFDF8; --deep:#2F4A3F; --deep-soft:#E2EBE4;
    --brass:#A8641F; --brass-soft:#F6E9D8; --oxblood:#8C3A2E; --oxblood-soft:#F5E3DF;
    --slate:#5B6B73; --slate-soft:#E6ECEF; --desk:#DCD1BE; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{margin:0;background:var(--desk);color:var(--body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .shell{display:flex;gap:34px;padding:34px 34px 60px;align-items:flex-start;max-width:1260px;margin:0 auto}
  .notes{flex:1 1 auto;min-width:300px;max-width:450px;position:sticky;top:34px}
  .notes h1{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:#8A8377;margin:0 0 6px;font-weight:800}
  .notes .lede{font-size:14.5px;line-height:1.55;color:#3B352E;margin:0 0 16px}
  .phases{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .phases a{text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:6px 10px;font-size:11px;font-weight:800;color:#4A443D;letter-spacing:.02em}
  .phases a:hover{border-color:#C9B79A}
  .phases a.on{background:var(--brass);border-color:var(--brass);color:#fff}
  .role{display:flex;gap:6px;margin:0 0 14px}
  .role button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 6px;
    font:inherit;font-size:11.5px;font-weight:700;color:#4A443D;cursor:pointer}
  .role button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
  .screens{display:flex;flex-direction:column;gap:1px}
  .screens button{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:9px;
    font:inherit;font-size:13px;color:#3B352E;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
  .screens button:hover{background:#EFE8DA}
  .screens button.on{background:var(--card);box-shadow:0 1px 0 var(--line),0 6px 16px rgba(60,45,25,.07);color:var(--ink);font-weight:700}
  .screens small{color:#9C948A;font-size:11px;font-weight:600}
  .what{font-size:13px;line-height:1.6;color:#4A443D;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:13px 14px;margin-top:14px}
  .what b{color:var(--ink)} .what p{margin:0 0 8px} .what p:last-child{margin:0}
  .stage{flex:0 0 auto}
  .phone{position:relative;width:390px;height:844px;background:var(--paper);border:11px solid #17140F;
    border-radius:52px;overflow:hidden;box-shadow:0 26px 60px rgba(35,25,15,.28)}
  .statusbar{height:42px;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;font-size:12.5px;font-weight:700;color:var(--ink);position:relative;z-index:4}
  .statusbar .icons{display:flex;align-items:center;gap:5px}
  #view{position:absolute;inset:42px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .screen{display:flex;flex-direction:column;flex:1;overflow:hidden}
  .scroll{overflow-y:auto;flex:1;padding:0 20px 26px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .appbar{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 8px;flex:0 0 auto;gap:10px}
  .eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#8A8377;font-weight:800}
  .back{border:0;background:transparent;padding:0;font:inherit;font-size:13px;color:var(--brass);font-weight:700;cursor:pointer}
  h2.title{font-size:24px;line-height:1.2;letter-spacing:-.015em;margin:6px 0 6px;color:var(--ink);font-weight:800;
    font-family:Georgia,"Times New Roman",serif}
  h3.sect{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#8A8377;margin:20px 0 9px;font-weight:800}
  p.sub{font-size:13.5px;line-height:1.55;color:#4A443D;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
    margin-bottom:9px;box-shadow:0 2px 10px rgba(50,35,20,.04)}
  .card.tap{cursor:pointer}.card.tap:hover{border-color:#D8CDB9}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .name{font-weight:700;font-size:14.5px;color:var(--ink)}
  .meta{font-size:12px;color:var(--muted)}
  .pill{display:inline-block;background:#EFE8DA;color:#4A443D;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:700}
  .tag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;margin:0 4px 4px 0;display:inline-block}
  .tag.deep{color:var(--deep);background:var(--deep-soft)}
  .tag.brass{color:var(--brass);background:var(--brass-soft)}
  .tag.slate{color:var(--slate);background:var(--slate-soft)}
  .tag.ox{color:var(--oxblood);background:var(--oxblood-soft)}
  .quote{font-size:14.5px;line-height:1.62;color:var(--ink);margin:6px 0 0}
  .quote.big{font-size:16px;font-family:Georgia,"Times New Roman",serif}
  .asked{font-size:12.5px;color:#8A8377;font-style:italic;line-height:1.5;margin:10px 0 0}
  .note{font-size:11.5px;line-height:1.55;color:#8A8377}
  .btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:13px;font:inherit;
    font-size:14.5px;font-weight:700;background:var(--deep);color:#fff;cursor:pointer;margin-top:8px}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn.small{padding:9px;font-size:13px}
  .btnrow{display:flex;gap:8px;margin-top:8px}.btnrow .btn{margin-top:0}
  .photos{display:flex;gap:8px;margin:14px 0 0;overflow:hidden}
  .ph{width:76px;height:76px;border-radius:11px;border:1px solid var(--line);flex:0 0 auto;
    background:repeating-linear-gradient(45deg,#EDE5D6,#EDE5D6 7px,#F4EEE2 7px,#F4EEE2 14px);
    display:flex;align-items:center;justify-content:center;font-size:8px;letter-spacing:.1em;
    text-transform:uppercase;color:#B3A996;text-align:center}
  .ph.big{width:100%;height:230px;border-radius:14px;font-size:10px}
  .ph.add{background:#FBF7EF;border-style:dashed;color:#BFB4A1;font-size:20px}
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:10px 12px;margin:4px 0 10px;color:#ADa495;font-size:13.5px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font:inherit;
    font-size:11.5px;font-weight:700;color:#6F675C;cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .meta-strip{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 0;padding:11px 12px;
    border:1px solid var(--line);border-radius:11px;background:#FFFBF3}
  .meta-strip div{font-size:11.5px;color:#6F675C}
  .meta-strip b{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#ADA493;font-weight:800;margin-bottom:2px}
  .tl{position:relative;padding-left:16px}
  .tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
  .tl-year{font-size:11px;font-weight:800;color:#ADA493;letter-spacing:.08em;margin:14px 0 6px}
  .tabbar{flex:0 0 auto;display:flex;justify-content:space-around;padding:9px 8px calc(9px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:rgba(246,241,231,.97)}
  .tabbar button{border:0;background:transparent;font:inherit;font-size:10px;font-weight:800;letter-spacing:.04em;
    color:#ADA493;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:2px 8px}
  .tabbar button.on{color:var(--deep)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
  .talkbar{flex:0 0 auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    background:rgba(246,241,231,.98)}
  .statebtn{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--card);
    border-radius:14px;padding:13px 15px;font:inherit;cursor:pointer}
  .statebtn .led{width:10px;height:10px;border-radius:50%;background:var(--brass);flex:0 0 auto;
    box-shadow:0 0 0 4px rgba(168,100,31,.14)}
  .statebtn.listen .led{background:var(--deep);box-shadow:0 0 0 4px rgba(47,74,63,.14)}
  .statebtn .txt{font-size:14.5px;font-weight:700;color:var(--ink);text-align:left;flex:1}
  .statebtn .hint{font-size:11px;color:#8A8377;font-weight:600}
  .caption{font-size:15px;line-height:1.55;color:#6F675C;padding:0 2px 6px}
  .sheet{position:absolute;inset:0;background:rgba(26,23,20,.34);display:none;align-items:flex-end;z-index:6}
  .sheet.on{display:flex}
  .sheet .inner{background:var(--paper);border-radius:22px 22px 0 0;padding:18px 20px 26px;width:100%;max-height:82%;overflow:auto}
  .grab{width:38px;height:4px;border-radius:2px;background:#DDD2BE;margin:0 auto 14px}
  .seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:0 0 10px;background:var(--card)}
  .seg button{flex:1;border:0;background:transparent;padding:10px 6px;font:inherit;font-size:12px;
    font-weight:700;color:#6F675C;cursor:pointer}
  .seg button.on{background:var(--deep-soft);color:var(--deep)}
  .bar{height:6px;border-radius:3px;background:#E8DFCE;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--brass);border-radius:3px}
  .who{display:flex;align-items:center;gap:9px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--brass-soft);color:var(--brass);font-weight:800;
    font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .av.v{background:var(--slate-soft);color:var(--slate)}
  .bubble{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;
    font-size:14px;line-height:1.55;color:var(--ink)}
  .bubble.her{background:var(--slate-soft);border-color:#D3DDE2;color:#33454D}
  .field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;min-height:64px;color:#BFB4A1;font-size:14px}
  /* ---- launch screen ---- */
  .launch{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:
    radial-gradient(120% 80% at 50% 20%,#FFFDF7 0%,#F6F1E7 46%,#EDE4D3 100%);position:relative;overflow:hidden}
  .launch .mark{width:64px;height:64px;border-radius:50%;border:1px solid rgba(168,100,31,.5);display:flex;
    align-items:center;justify-content:center;animation:pop 900ms ease-out both}
  .launch .mark:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--brass);
    animation:pulse 2.6s ease-in-out infinite}
  .launch h1{font-family:Georgia,serif;font-size:26px;letter-spacing:.01em;color:var(--ink);margin:22px 0 6px;
    font-weight:400;animation:fadeUp 900ms 180ms ease-out both}
  .launch p{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#A79C8B;margin:0;
    animation:fadeUp 900ms 380ms ease-out both}
  .launch .rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,#C9B79A,transparent);
    margin:26px 0 0;transform-origin:center;animation:draw 1100ms 500ms ease-out both}
  .launch .foot{position:absolute;bottom:28px;font-size:10.5px;color:#B3A996;letter-spacing:.06em;
    animation:fadeUp 900ms 900ms ease-out both}
  @keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
  @keyframes pulse{0%,100%{transform:scale(.7);opacity:.55}50%{transform:scale(1);opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  /* ---- waveform ---- */
  .wave{display:flex;align-items:center;gap:4px;height:34px}
  .wave i{display:block;width:3px;border-radius:2px;background:var(--brass);height:10px;
    animation:rise 1.1s ease-in-out infinite}
  .wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}
  .wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
  .wave i:nth-child(6){animation-delay:.60s}.wave i:nth-child(7){animation-delay:.72s}
  @keyframes rise{0%,100%{height:8px;opacity:.5}50%{height:26px;opacity:1}}
  @media (max-width:1100px){.shell{flex-direction:column;align-items:center}.notes{position:static;max-width:520px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="notes">
    <h1 id="phaseTitle">Storykeeper · spec v4</h1>
    <p class="lede" id="lede">One app, three people in it: the storyteller, the family who add a perspective, and the buyer when it is a gift. Everything here is clickable.</p>
    <div class="phases" id="phaseNav"></div>
    <div class="role">
      <button id="rDavid" class="on" onclick="setRole('david')">Storyteller</button>
      <button id="rSusan" onclick="setRole('susan')">Family</button>
      <button id="rBuyer" onclick="setRole('buyer')">Buyer</button>
    </div>
    <div class="screens" id="list"></div>
    <div class="what" id="what"></div>
  </aside>

  <div class="stage">
    <div class="phone">
      <div class="statusbar">
        <span>10:41</span>
        <div class="icons">
          <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#1A1714"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#1A1714"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#1A1714"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#1A1714" opacity=".35"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 9.5l2-2.2a3 3 0 00-4 0L8 9.5zm0-4.6a6 6 0 014.2 1.7l1.3-1.4a8 8 0 00-11 0l1.3 1.4A6 6 0 018 4.9z" fill="#1A1714"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.5" y="0.5" width="20" height="10" rx="3" fill="none" stroke="#1A1714" opacity=".4"/><rect x="2" y="2" width="15" height="7" rx="2" fill="#1A1714"/><rect x="21.5" y="4" width="2" height="3" rx="1" fill="#1A1714" opacity=".5"/></svg>
        </div>
      </div>
      <div id="view"></div>
      <div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="inner" id="sheetInner"></div></div>
    </div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------ data */
const D = {
  name: "David Wu",
  stories: [
    { id:"fire", title:"The night the shop burned", year:1962, place:"Sham Shui Po", theme:"the shop",
      time:"4:12 – 6:03", calls:3, asked:"What do you remember about the night the shop burned?",
      said:"I was upstairs. I could smell it before I could see it. We lost the back room and everything in it.",
      photos:2, perspectives:2, people:["my father","my mother"], mine:true },
    { id:"bike", title:"The green motorbike", year:1980, place:"Nathan Road", theme:"first work",
      time:"8:47 – 9:13", calls:1, asked:"Tell me about the day you got the bike.",
      said:"I was twenty two and working at a print shop. I had saved for a year. It was a Kawasaki Ninja, green. I rode it home along the highway with the sun going down behind me.",
      photos:3, perspectives:0, people:["Ah Kin"], mine:true },
    { id:"tram", title:"The tram at night", year:1958, place:"Wan Chai", theme:"childhood home",
      time:"6:34 – 7:20", calls:1, asked:"What did you hear at night where you grew up?",
      said:"You could hear the tram all night. I didn't mind it. I still can't sleep in a quiet room.",
      photos:1, perspectives:1, people:["my mother"], mine:true },
    { id:"susans", title:"The year we all lived in Sai Kung", year:1991, place:"Sai Kung", theme:"family",
      time:"3:10", calls:1, asked:"Susan, what do you remember about Sai Kung?",
      said:"We had no furniture for a month. The children ate dinner sitting on the floor and thought it was a holiday.",
      photos:4, perspectives:1, people:["Susan","Peter"], mine:false, by:"Susan" }
  ],
  aspects: [
    { id:"childhood", name:"childhood", depth:3, stories:3, q:"What was the street like after dark?" },
    { id:"school", name:"school", depth:1, stories:1, q:"Who was the teacher you were afraid of?" },
    { id:"work", name:"work", depth:3, stories:4, q:"What did the print shop smell like?" },
    { id:"shop", name:"the shop", depth:3, stories:2, q:"What did your father keep under the till?" },
    { id:"love", name:"love", depth:1, stories:1, q:"How did you know about your wife?" },
    { id:"children", name:"your children", depth:2, stories:2, q:"What were they like at six?" },
    { id:"places", name:"places lived", depth:1, stories:1, q:"Which flat was the coldest?" },
    { id:"friends", name:"friends", depth:0, stories:0, q:"Who did you get in trouble with?" },
    { id:"loss", name:"loss", depth:2, stories:1, q:"Who did you lose first?" },
    { id:"objects", name:"objects kept", depth:1, stories:1, q:"What is in the drawer you never open?" },
    { id:"travel", name:"travel", depth:0, stories:0, q:"Did you ever leave Hong Kong?" },
    { id:"beliefs", name:"beliefs", depth:0, stories:0, q:"What do you believe now that you did not at forty?" }
  ],
  shelf: [ { label:"the shop, 1961" }, { label:"a wedding, unlabelled" }, { label:"motorbike, 1980" } ],
  perspectives: {
    fire: [
      { id:"p1", who:"Susan", rel:"his daughter", kind:"account", when:"8 Nov",
        text:"I was nine. I remember being carried down the stairs and the smell, and being told the shop was fine when it wasn't." },
      { id:"p2", who:"Peter", rel:"his son", kind:"correction", when:"9 Nov",
        text:"It was 1972, not 1971. I have the insurance letter." }
    ],
    tram: [ { id:"p3", who:"Susan", rel:"his daughter", kind:"account", when:"8 Nov",
        text:"He told me this when I was small and I have never forgotten it. Now I know why I need a fan on to sleep." } ],
    susans: [ { id:"p4", who:"Peter", rel:"his son", kind:"account", when:"10 Nov",
        text:"I remember the floor dinners. I also remember being told not to tell Grandad we had no chairs." } ]
  },
  settings: { style:"prober", speed:"normal", avoid:"my brother's death", address:"Dave", patience:2.5 }
};

// Which phase this build is. Each phase is a different app: screens, roles and
// functions that do not exist in that phase must not appear at all, because a
// button that opens nothing is a promise the build cannot keep.
const PHASE = (window.PHASE === undefined) ? null : window.PHASE;
const PHASE_HOME = { 0:"launch", 1:"talk", 2:"story", 3:"gift" };
const ROLES_BY_PHASE = { 0:["design"], 1:["david"], 2:["david","susan"], 3:["buyer","david"] };
const ALLOWED = PHASE === null ? ["david","susan","buyer"] : ROLES_BY_PHASE[PHASE];
const HAS = {
  notebook:   PHASE === null || PHASE === 1,          // the plan and the corpus
  perspectives: PHASE === null || PHASE >= 2,          // other people's accounts
  invite:     PHASE === null || PHASE >= 2,            // inviting a contributor
  sharedFilter: PHASE === null || PHASE >= 2,          // stories shared with me
  buyer:      PHASE === null || PHASE === 3,           // gifting
};

const SCREENS = {
  design: [
    { id:"style",    label:"Design system",  sub:"tokens, type, states", ph:[0] },
    { id:"launch",   label:"Launch",         sub:"the first second", ph:[0] },
  ],
  david: [
    { id:"launch",   label:"Launch",          sub:"the first second", ph:[0] },
    { id:"talk",     label:"Call",            sub:"she speaks first", ph:[1] },
    { id:"session",  label:"In a session",    sub:"photo cue", ph:[1] },
    { id:"notebook", label:"Notebook",        sub:"your own map", ph:[1] },
    { id:"aspect",   label:"An aspect",       sub:"pick, then plan", ph:[1] },
    { id:"archive",  label:"Archive",         sub:"everything you can see", ph:[1] },
    { id:"story",    label:"A story",         sub:"words, photos, people", ph:[1] },
    { id:"perspective", label:"A perspective", sub:"someone else's", ph:[2] },
    { id:"settings", label:"Settings",        sub:"core first", ph:[1] }
  ],
  susan: [
    { id:"invite",    label:"The invitation",  sub:"install, or a link", ph:[2] },
    { id:"contrib",   label:"Stories about you", sub:"where you appear", ph:[2] },
    { id:"cstory",    label:"One memory",      sub:"his words", ph:[2] },
    { id:"contribute",label:"Contribute",      sub:"by voice", ph:[2] }
  ],
  buyer: [
    { id:"gift",     label:"Give it",        sub:"before she starts", ph:[3] },
    { id:"progress", label:"Progress",       sub:"counts, not content", ph:[3] }
  ]
};

const WHAT = {
  style: "<b>Phase 0, in full.</b><p>Colour, type, buttons, the state control, tags, motion and the accessibility floor. Nothing on this page is a feature. The screens come in Phase 1, and no screen from a later phase appears in this build.</p>",
  launch: "<b>The first second.</b><p>A mark that breathes, the name, and a rule drawn underneath. No logo animation that delays anything: it holds for about a second while the voice warms, then the call opens.</p>",
  talk: "<b>Her, not a blank page.</b><p>Her name, a waveform that only moves when she speaks, the caption of what she is saying, and the last story as a chip you can tap. The screen is warm because a person is talking to you.</p>",
  session: "<b>One control, and an honest exit.</b><p>The button says who has the floor. Done asks once, so a story mid-sentence is not lost to a mistap.</p>",
  notebook: "<b>Yours, and only yours.</b><p>Notebook is the diary side: what you have covered, how deep you have gone, what is untouched, and the photos waiting for a story. Each aspect opens so you can plan a session around it.</p>",
  aspect: "<b>Pick, then plan.</b><p>Tapping an aspect shows what it already holds and what she would ask inside it. Planning it means the next call starts there, instead of her choosing.</p>",
  archive: "<b>Everything you are allowed to see.</b><p>Your stories and the ones family have shared with you, in one searchable place, with filters for person, year, photos and perspectives.</p>",
  story: "<b>His record, with room to correct it.</b><p>He can add to or correct his own story, which opens a conversation with it loaded. Other people's accounts are perspectives, and the voice label changes with who is looking.</p>",
  perspective: "<b>Their record, not yours to edit.</b><p>You may hide it from your view. You may not alter or delete it: the account belongs to the person who gave it, and the event of it is kept even when it leaves your screen.</p>",
  settings: "<b>Deferred.</b><p>Core first. Only what the core needs lives here for now.</p>",
  invite: "<b>Install first.</b><p>The invitation opens the store if the app is missing, and the invitation itself is a page on the web so the link always works. The contribution page in a browser is the fallback, not the front door.</p>",
  contrib: "<b>Where she is named.</b><p>Four memories, each with the sentence that names her, plus the stories she has started herself.</p>",
  cstory: "<b>His words, her ear.</b><p>Read and listen. One action: contribute, by voice.</p>",
  contribute: "<b>Voice first.</b><p>She hears the story, then a prompt, then speaks. Typing is the fallback.</p>",
  gift: "<b>The gift is a door, not a purchase.</b><p>The buyer sets up nothing about the life. They write a note, name the person, and pay. The first screen the storyteller sees is that note, not a product tour.</p>",
  progress: "<b>Counts, not content.</b><p>The buyer sees that stories are being made, never what they say, unless the storyteller opens them. This is the opposite of the industry default and it is the reason a parent would trust it.</p>"
};

/* ------------------------------------------------------------------ state */
let role = "david", cur = "launch", story = "fire", perspective = "p1", listening = true, aspect = "childhood";

const phone = () => document.getElementById("view");
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const wave = () => `<div class="wave">${Array.from({length:7}).map(()=>"<i></i>").join("")}</div>`;

function go(id, arg) { if (arg) story = arg; cur = id; render(); }
function goA(id, aid) { aspect = aid; go(id); }
function setRole(r, nav = true) {
  if (!ALLOWED.includes(r)) r = ALLOWED[0];
  role = r; paintRole();
  if (nav) go(r === "david" ? PHASE_HOME[PHASE ?? 1] : r === "susan" ? "contrib" : r === "design" ? "style" : "gift");
}

function paintPhaseNav() {
  const nav = document.getElementById("phaseNav");
  if (!nav) return;
  // The same file is served from the root and from inside phase-N/, so the prefix
  // is derived rather than hard-coded.
  const inside = /\/phase-\d+\//.test(location.pathname);
  const base = inside ? "../" : "./";
  const items = [
    ["All screens", base + "storykeeper-flow.html", null],
    ["Phase 0", base + "phase-0/", 0],
    ["0.5", base + "phase-0-5/", "0.5"],
    ["Phase 1", base + "phase-1/", 1],
    ["Phase 2", base + "phase-2/", 2],
    ["Phase 3", base + "phase-3/", 3],
  ];
  nav.innerHTML = items.map(([label, href, n]) => {
    const on = (n === "0.5") ? /phase-0-5/.test(location.pathname) : n === PHASE;
    return `<a href="${href}" class="${on ? "on" : ""}">${label}</a>`;
  }).join("");
}

function paintRole() {
  paintPhaseNav();
  const roleRow = document.querySelector(".role");
  if (roleRow) roleRow.style.display = (PHASE === 0) ? "none" : "";
  ["david","susan","buyer"].forEach(r => {
    const b = document.getElementById("r"+r[0].toUpperCase()+r.slice(1));
    if (!b) return;
    b.style.display = ALLOWED.includes(r) ? "" : "none";
    b.classList.toggle("on", role === r);
  });
  const list = document.getElementById("list"); list.innerHTML = "";
  // Filtered to the phase, but never hide the screen you are actually on: a link
  // from inside a phase (a story opens a perspective) must still show its place.
  // Screens are cumulative: what Phase 1 built still exists in Phase 3. `ph` is
  // the phase a screen is introduced in, never the only phase it lives in.
  const shown = SCREENS[role].filter(s => PHASE === null || (s.ph || [0]).some(p => p <= PHASE) || s.id === cur);
  shown.forEach(s => {
    const b = el(`<button onclick="go('${s.id}')"><span>${s.label}</span><small>${s.sub}</small></button>`);
    if (s.id === cur) b.classList.add("on");
    list.appendChild(b);
  });
}

// Tabs are derived from the screen table rather than hard-coded, so a phase build
// cannot carry the name of a screen it does not contain.
const TAB_IDS = { david:["talk","notebook","archive","settings"], susan:["contrib","cstory"],
                  buyer:["gift","progress"], design:[] };
function tabs(active) {
  const byId = Object.fromEntries(SCREENS[role].map(s => [s.id, s.label]));
  const mine = (TAB_IDS[role] || []).filter(id => byId[id]);
  return `<div class="tabbar">${mine.map(id =>
    `<button class="${id===active?'on':''}" onclick="go('${id}')"><span class="dot"></span>${byId[id]}</button>`).join("")}</div>`;
}

  return `<div class="scroll">
    <div class="appbar"><span class="eyebrow">storykeeper</span><span class="pill">invitation</span></div>
    <h2 class="title" style="margin-top:20px">Dave has asked you to add a perspective</h2>
    <p class="sub" style="margin-top:10px">He is recording his life. The stories where you appear are yours too, and you can add what you remember beside them.</p>
    <div class="card"><div class="row"><span class="name" style="font-size:13.5px">You will be shown</span><span class="meta">4 memories</span></div></div>
    <div class="card"><div class="row"><span class="name" style="font-size:13.5px">You can add</span><span class="meta">your own perspective</span></div></div>
    <div class="card"><div class="row"><span class="name" style="font-size:13.5px">You cannot</span><span class="meta">change his words</span></div></div>
    <button class="btn" onclick="toast('Opens the store, then back to this invitation')">Open Storykeeper</button>
    <button class="btn ghost" onclick="go('contribute')">Answer in the browser instead</button>
    <p class="note" style="text-align:center;margin-top:10px">The app keeps your stories and lets you start your own. The browser does not.</p>
  </div>`;
}

function scrContrib() {
  const mine = D.stories.filter(s => !s.mine);
  return `<div class="scroll">
    <div class="appbar"><span class="eyebrow">stories about you</span><span class="meta">${mine.length} memories</span></div>
    <h2 class="title">Dave's life</h2>
    <p class="sub">You were there for these. Contribute by voice, and it sits beside his words with your name on it.</p>
    ${mine.map(s => `<div class="card tap" onclick="go('cstory','${s.id}')">
      <div class="row"><span class="name">${s.title}</span><span class="meta">${s.year}</span></div>
      <p class="quote" style="font-size:13.5px">${s.said.length>96?s.said.slice(0,96)+"…":s.said}</p>
      <div style="margin-top:9px"><span class="tag slate">your perspective</span></div></div>`).join("")}
    <div class="card" style="margin-top:6px">
      <div class="row"><span class="name" style="font-size:13.5px">Your own stories</span><span class="tag brass">new</span></div>
      <p class="note" style="margin-top:6px">The same thing he is doing, for your life. Same app, same Mina.</p>
      <button class="btn ghost small" onclick="toast('Setup begins with her introduction')">Start mine</button>
    </div>
  </div>${tabs('contrib')}`;
}

function scrCstory() {
  const s = D.stories.find(x => x.id === story) || D.stories[0];
  return `<div class="scroll">
    <div class="appbar"><button class="back" onclick="go('contrib')">‹ About you</button><span class="eyebrow">${s.year}</span></div>
    <h2 class="title" style="font-size:21px">${s.title}</h2>
    <p class="quote big">${s.said}</p>
    <p class="note" style="margin-top:6px">his words · you may read and hear these, not change them</p>
    <div class="photos" style="margin-top:12px">${Array.from({length:s.photos||1}).map(() => `<div class="ph">photo</div>`).join("")}</div>
    <h3 class="sect">your perspective</h3>
    ${(D.perspectives[s.id]||[]).filter(p => p.who==="Susan").map(x => `<div class="card" style="border-left:3px solid var(--slate)">
      <p class="quote" style="font-size:14px">${x.text}</p><p class="note" style="margin-top:8px">added ${x.when}</p></div>`).join("") || `<p class="note">Nothing yet.</p>`}
    <button class="btn" onclick="go('contribute')">Contribute</button>
  </div>${tabs('cstory')}`;
}

function scrContribute() {
  const s = D.stories.find(x => x.id === story) || D.stories[0];
  return `<div class="scroll" style="display:flex;flex-direction:column">
    <div class="appbar"><button class="back" onclick="go('cstory')">‹ Back</button><span class="eyebrow">contribute</span><span class="pill">as Susan</span></div>
    <div class="ph" style="width:100%;height:126px;margin-bottom:10px">photograph · ${s.title}</div>
    <div class="bubble">“${s.said}”</div>
    <p class="note" style="margin:2px 0 10px">his words · she will play them to you</p>
    <div class="bubble her">What do you remember about that night? Anything at all, even a smell.</div>
    <div style="flex:1"></div>
    <div style="padding:10px 0 4px">
      <button class="btn" style="padding:18px;font-size:16px" onclick="toast('Recording… tap again when you are done')">● Hold to speak</button>
      <p class="note" style="text-align:center;margin-top:8px">Her question is asked out loud too, so you can answer without reading.</p>
      <p class="note" style="text-align:center;margin-top:14px;text-decoration:underline" onclick="toast('Typing is the fallback')">rather type it</p>
    </div>
  </div>`;
}

/* ---- buyer ---- */
function scrGift() {
  return `<div class="scroll">
    <div class="appbar"><span class="eyebrow">storykeeper gift</span><span class="pill">£89 a year</span></div>
    <h2 class="title" style="margin-top:14px">Give a year of her asking</h2>
    <p class="sub">One call a week for a year, in his own words and his own voice. At the end, a book, and the recordings behind it.</p>
    <h3 class="sect">who is it for</h3>
    <div class="card" style="padding:12px 14px"><span class="meta">Their name and phone number</span></div>
    <h3 class="sect">a note from you</h3>
    <div class="card" style="min-height:92px"><p style="font-size:13.5px;color:#BFB4A1;margin:0">He will hear this before anything else. Not a product tour.</p></div>
    <div class="card" style="padding:12px 14px">
      <div class="row"><span class="name" style="font-size:13.5px">You will see</span><span class="meta">that stories are being made</span></div>
      <p class="note" style="margin-top:6px">Not what they say. He can open them to you, and nothing is opened by default.</p>
    </div>
    <button class="btn" onclick="toast('Invitation sent. Nothing more to set up.')">Send the gift</button>
    <p class="note" style="text-align:center;margin-top:10px">He can decline, and you are refunded.</p>
  </div>${tabs('gift')}`;
}

function scrProgress() {
  return `<div class="scroll">
    <div class="appbar"><span class="eyebrow">my gift</span><span class="meta">Dave</span></div>
    <h2 class="title">Dave is recording</h2>
    <p class="sub">This is all you see unless he decides otherwise. It is not a dashboard about a person.</p>
    <div class="card"><div class="row"><span class="name">Stories so far</span><span class="meta">7</span></div>
      <div class="bar"><i style="width:42%"></i></div><p class="note" style="margin-top:8px">42% of a year of calls</p></div>
    <div class="card"><div class="row"><span class="name">Calls</span><span class="meta">3</span></div></div>
    <div class="card"><div class="row"><span class="name">Shared with you</span><span class="meta">1 story</span></div>
      <p class="note" style="margin-top:6px">He opened the tram story to you on 9 November.</p></div>
    <div class="card" style="padding:12px 14px"><p class="note" style="margin:0">If he stops, you are told, and you are not told why.</p></div>
  </div>${tabs('progress')}`;
}

/* ------------------------------------------------------------------ sheets */
function openSheet(kind) {
  const s = document.getElementById("sheet"), inner = document.getElementById("sheetInner");
  if (kind === "photo") inner.innerHTML = `<div class="grab"></div>
    <h3 class="sect" style="margin-top:0">a photograph</h3>
    <p class="sub">It waits in your notebook until it has a story, and she can open the next call with it.</p>
    <div class="photos"><div class="ph">library</div><div class="ph">camera</div></div>
    <button class="btn" onclick="closeSheet();toast('Waiting in your notebook')">Keep it</button>`;
  else if (kind === "plan") inner.innerHTML = `<div class="grab"></div>
    <h3 class="sect" style="margin-top:0">plan the next session</h3>
    <p class="sub">Pick one. She opens there, then follows wherever it goes.</p>
    ${D.aspects.filter(a=>a.stories).slice(0,5).map(a => `<div class="card tap" style="padding:11px 13px" onclick="closeSheet();toast('Next call opens on ' + '${a.name}')">
      <div class="row"><span class="name" style="font-size:13px">${a.name}</span><span class="meta">${a.q}</span></div></div>`).join("")}`;
  else if (kind === "correct") inner.innerHTML = `<div class="grab"></div>
    <h3 class="sect" style="margin-top:0">correct or add to this story</h3>
    <p class="sub">This opens a call with the story loaded, so you can talk it through rather than edit a document.</p>
    <div class="card" style="padding:12px 14px"><p class="quote" style="font-size:13.5px">“We lost the back room and everything in it.”</p></div>
    <div class="seg"><button class="on">Talk it through</button><button>Change the words</button></div>
    <button class="btn" onclick="closeSheet();toast('Mina will start from this story')">Start</button>`;
  else if (kind === "invite") inner.innerHTML = `<div class="grab"></div>
    <h3 class="sect" style="margin-top:0">invite collaborators</h3>
    <p class="sub">Anyone who was there. They add their own perspective and never change your words.</p>
    <div class="card" style="padding:12px 14px"><span class="meta">Phone number or email</span></div>
    <div class="card" style="padding:12px 14px"><span class="meta">Who they are · daughter, cousin, old friend</span></div>
    <p class="note" style="margin-top:8px">The link opens the app if they have it, the store if they do not, and a browser page if they would rather not install.</p>
    <button class="btn" onclick="closeSheet();toast('Invitation sent')">Send</button>`;
  else if (kind === "endcall") inner.innerHTML = `<div class="grab"></div>
    <h3 class="sect" style="margin-top:0">end this call?</h3>
    <p class="sub">What you have said is kept. She will pick it up next time.</p>
    <div class="btnrow"><button class="btn" onclick="closeSheet();go('talk')">End and keep</button>
      <button class="btn ghost" onclick="closeSheet()">Carry on</button></div>`;
  else inner.innerHTML = `<div class="grab"></div><h3 class="sect" style="margin-top:0">who can see what</h3>
    <p class="sub">Three tiers, one direction. Nothing moves up without you saying so.</p>
    <button class="btn" onclick="closeSheet()">Done</button>`;
  s.classList.add("on");
}
function closeSheet() { document.getElementById("sheet").classList.remove("on"); }
function toast(msg) {
  openSheet("permless");
  document.getElementById("sheetInner").innerHTML =
    `<div class="grab"></div><p class="quote" style="text-align:center;padding:18px 6px">${msg}</p><button class="btn" onclick="closeSheet()">Close</button>`;
}
function goP(pid) { perspective = pid; go("perspective"); }
function toggle() { listening = !listening; render(); }
function setS(k, v) { D.settings[k] = v; render(); }

/* ------------------------------------------------------------------ render */
function render() {
  const map = { style:scrStyle, launch:scrLaunch, talk:scrTalk, session:scrSession, notebook:scrNotebook, aspect:scrAspect,
    archive:scrArchive, story:scrStory, perspective:scrPerspective, settings:scrSettings,
    invite:scrInvite, contrib:scrContrib, cstory:scrCstory, contribute:scrContribute,
    gift:scrGift, progress:scrProgress };
  phone().innerHTML = '<div class="screen">' + (map[cur] || scrLaunch)() + '</div>';
  let whatText = WHAT[cur] || "";
  if (cur === "story" && !HAS.perspectives)
    whatText = "<b>His record, with room to correct it.</b><p>He can add to or correct his own story, which opens a conversation with it loaded. Nothing else is here: no other voices, no invitations. Those come in Phase 2.</p>";
  document.getElementById("what").innerHTML = whatText;

  const LEDE = {
    0: "The look and feel only. Colour, type, components and motion, because everything later is built from them.",
    1: "One app, one person, recording their own life. No sharing and no gifting: those arrive in later phases, and nothing from them appears here.",
    2: "The same app, plus family. People read only the stories that name them, and add their own account beside his.",
    3: "A gift bought by someone else, used by a person who never opens a setting.",
  };
  const ledeEl = document.getElementById("lede");
  if (ledeEl && PHASE !== null) ledeEl.textContent = LEDE[PHASE];
  const pt = document.getElementById("phaseTitle");
  if (pt && PHASE !== null) pt.textContent = ["Phase 0 · identity and feel","Phase 1 · the individual product","Phase 2 · sharing and collaboration","Phase 3 · gifting and remote setup"][PHASE];
  paintRole();
  location.hash = cur;
}

function roleFor(id) {
  if (PHASE === 0) return "design";
  if (["invite","contrib","cstory","contribute"].includes(id)) return "susan";
  if (id === "gift" || id === "progress") return "buyer";
  return "david";
}
const start = (location.hash || "").replace("#", "");
cur = Object.keys(WHAT).includes(start) ? start : (PHASE === null ? "launch" : PHASE === 0 ? "style" : PHASE_HOME[PHASE]);
setRole(roleFor(cur), false);
go(cur);
</script>
</body>
</html>
